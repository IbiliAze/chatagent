[project]
name = "chatagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "gliner>=0.2.27",
    "langchain>=1.0",
    "langchain-anthropic>=1.4.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.9",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.1",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langsmith>=0.10.2",
    "lingua-language-detector>=2.2.0",
    "mcp>=1.28.1",
    "opensearch-py>=3.2.0",
    "presidio-analyzer>=2.2.363",
    "presidio-anonymizer>=2.2.363",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "slowapi>=0.1.10",
    "tiktoken>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/core", "src/api"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pylint>=4.0.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
# importlib mode keeps same-named test modules in different folders from colliding
# (three test_security_guard.py, two test_rag.py, two cases.py) without needing
# __init__.py in every test directory.
addopts = "--import-mode=importlib"
consider_namespace_packages = true
asyncio_mode = "auto"
markers = [
    "integration: makes real network calls to external services (slow, needs credentials)",
    "regression: replays a fixed dataset against real LLM calls to catch quality drift",
]

[tool.pylint."MESSAGES CONTROL"]
disable = ["redefined-outer-name", "unnecessary-ellipsis"]
